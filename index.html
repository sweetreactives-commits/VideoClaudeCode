<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Апчхи! — превью</title>
    <style>
      :root {
        --bg: #17130f;
        --panel: #231c16;
        --text: #f6ead6;
        --muted: #b9a68c;
        --accent: #f4b63a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 Nunito, system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: min(100vw, calc((100vh - 96px) * 16 / 9));
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        background: #000;
      }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      body.bare #stage { width: auto; aspect-ratio: auto; }
      body.bare #stage canvas { position: static; width: auto; height: auto; }
      body.bare #overlay { display: none; }
      #ui {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
      }
      #ui button, #ui select {
        background: #342920;
        color: var(--text);
        border: 1px solid #4a3a2c;
        border-radius: 8px;
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
      }
      #ui button.on { background: var(--accent); color: #2a1a0a; border-color: var(--accent); }
      #play { width: 44px; font-size: 16px; }
      #scrub { flex: 1 1 320px; accent-color: var(--accent); }
      #time { color: var(--muted); min-width: 260px; font-variant-numeric: tabular-nums; }
      #shots { display: flex; gap: 6px; flex-wrap: wrap; }
      label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui" hidden>
      <button id="play" title="Пробел">▶</button>
      <input id="scrub" type="range" min="0" step="1" value="0" />
      <span id="time"></span>
      <div id="shots"></div>
      <label>Разрешение
        <select id="res">
          <option value="640">640×360</option>
          <option value="960">960×540</option>
          <option value="1280" selected>1280×720</option>
          <option value="1920">1920×1080</option>
        </select>
      </label>
      <label><input id="post" type="checkbox" checked /> пост-обработка</label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
